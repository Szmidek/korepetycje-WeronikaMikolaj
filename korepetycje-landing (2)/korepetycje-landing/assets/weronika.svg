<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-labelledby="wTitle">
  <title id="wTitle">Weronika Zacłona — miejsce na zdjęcie</title>
  <defs>
    <linearGradient id="wBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151221"/>
      <stop offset="55%" stop-color="#0e0d13"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="wGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="wGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="600" fill="url(#wBg)"/>
  <rect width="480" height="600" fill="url(#wGrid)"/>
  <circle cx="240" cy="190" r="220" fill="url(#wGlow)"/>

  <!-- Abstract monogram figure -->
  <circle cx="240" cy="230" r="72" fill="none" stroke="url(#wLine)" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M140 430 C140 340 190 300 240 300 C290 300 340 340 340 430" fill="none" stroke="url(#wLine)" stroke-width="1.5" stroke-opacity="0.7"/>

  <text x="240" y="245" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="54" font-weight="700" fill="#f2f1f5">W</text>

  <text x="240" y="520" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#6c6b76">WERONIKA ZACŁONA</text>
  <text x="240" y="545" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5" fill="#4a4954">DODAJ ZDJĘCIE — WERONIKA.JPG</text>
</svg>
